<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#296F35" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Directory" />
  <title>Login - Compass Directory</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50:'#eaf7ec', 100:'#c2e6c8', 200:'#9bd5a3', 500:'#3a8a4a', 600:'#296F35', 700:'#1e5929', 900:'#0f3315' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .bg-gradient { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 30%, #fef9c3 70%, #fef3c7 100%); }
    .login-card { animation: fadeUp 0.6s ease-out; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .input-ring { transition: box-shadow 0.2s ease, border-color 0.2s ease; }
    .input-ring:focus { box-shadow: 0 0 0 3px rgba(41,111,53,0.15); }
    .btn-loading { position: relative; overflow: hidden; }
    .btn-loading::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); translate: -100%; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 100% { translate: 100%; } }
    @media (prefers-reduced-motion: reduce) { .login-card { animation: none; } .btn-loading::after { display: none; } }
  </style>
</head>
<body class="bg-gradient min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md login-card">
    <div class="text-center mb-8">
      <img src="/logo.png" alt="Compass Avaya Directory" class="h-24 w-auto mx-auto mb-5 rounded-2xl shadow-lg shadow-slate-200/60" />
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome back</h1>
      <p class="text-slate-500 text-sm mt-1.5">Sign in to manage your directory</p>
    </div>

    <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-xl shadow-slate-200/50 border border-white/50 p-8">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-5">
          <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="admin@compass.com"
            class="input-ring w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 bg-white/50" />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="password">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"
              class="input-ring w-full px-4 py-3 pr-11 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 bg-white/50" />
            <button type="button" onclick="togglePasswordVisibility(this)" data-target="password" aria-label="Show password"
              class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600 cursor-pointer rounded-lg">
              <svg class="eye-show w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg class="eye-hide w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>
        <div class="flex items-center gap-2.5 mb-5">
          <input id="rememberMe" type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500 cursor-pointer" />
          <label for="rememberMe" class="text-sm text-slate-600 cursor-pointer select-none">Remember me</label>
        </div>
        <div id="errorMsg" class="hidden mb-5 p-3.5 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm font-medium flex items-center gap-2">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="errorText"></span>
        </div>
        <button type="submit" id="loginBtn"
          class="btn-loading w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all duration-200 cursor-pointer text-sm active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed">
          Sign In
        </button>
      </form>
    </div>

    <p class="text-center mt-6">
      <a href="/" class="text-sm text-slate-400 hover:text-brand-600 transition-colors inline-flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to Directory
      </a>
    </p>
  </div>

<script>
function togglePasswordVisibility(btn) {
  const input = document.getElementById(btn.dataset.target);
  if (!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.querySelector('.eye-show').classList.toggle('hidden', show);
  btn.querySelector('.eye-hide').classList.toggle('hidden', !show);
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');
  const errText = document.getElementById('errorText');
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.classList.add('btn-loading');
  btn.textContent = 'Signing in...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const raw = await res.text();
    let data = {};
    try { data = raw ? JSON.parse(raw) : {}; } catch {
      errText.textContent = 'Server error (' + res.status + '). Check Node stderr / DB connection.';
      errEl.classList.remove('hidden');
      return;
    }
    if (res.ok) {
      localStorage.removeItem('token');
      localStorage.removeItem('admin');
      sessionStorage.removeItem('token');
      sessionStorage.removeItem('admin');
      const store = document.getElementById('rememberMe').checked ? localStorage : sessionStorage;
      store.setItem('token', data.token);
      store.setItem('admin', JSON.stringify(data.admin));
      if (data.admin.role === 'super_admin') window.location.href = '/superadmin';
      else if (data.admin.role === 'admin' || data.admin.role === 'manager') window.location.href = '/admin';
      else window.location.href = '/';
    } else {
      errText.textContent = data.error || 'Invalid email or password';
      errEl.classList.remove('hidden');
    }
  } catch (err) {
    errText.textContent = 'Network error. Please try again.';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.classList.remove('btn-loading');
    btn.textContent = 'Sign In';
  }
}
</script>
<script src="/register-sw.js"></script>
</body>
</html>
