<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#296F35" />
  <title>Set new password - Compass Directory</title>
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50:'#eaf7ec', 600:'#296F35', 700:'#1e5929' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .bg-gradient { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 30%, #fef9c3 70%, #fef3c7 100%); }
    .input-ring:focus { box-shadow: 0 0 0 3px rgba(41,111,53,0.15); border-color: #296F35; }
  </style>
</head>
<body class="bg-gradient min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <img src="/logo.png" alt="Compass Directory" class="h-20 w-auto mx-auto mb-4 rounded-2xl shadow-lg" />
      <h1 class="text-2xl font-extrabold text-slate-900">Create your password</h1>
      <p class="text-slate-500 text-sm mt-1.5">You signed in with a temporary password. Set a new one to continue.</p>
    </div>

    <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-xl border border-white/50 p-8">
      <ul class="text-xs text-slate-600 mb-5 space-y-1 bg-slate-50 rounded-xl p-3 border border-slate-100">
        <li>At least <strong>8 characters</strong></li>
        <li>One <strong>uppercase</strong> and one <strong>lowercase</strong> letter</li>
        <li>One <strong>number</strong> and one <strong>special character</strong></li>
      </ul>
      <form id="pwdForm" onsubmit="handleSetPassword(event)">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" required
            class="input-ring w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none bg-white" />
        </div>
        <div class="mb-5">
          <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" required
            class="input-ring w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none bg-white" />
        </div>
        <p id="pwdError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm font-medium"></p>
        <button type="submit" id="pwdBtn" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl cursor-pointer text-sm disabled:opacity-60">
          Save password &amp; continue
        </button>
      </form>
    </div>
    <p class="text-center mt-4">
      <button type="button" onclick="logout()" class="text-sm text-slate-500 hover:text-red-600 cursor-pointer">Sign out</button>
    </p>
  </div>

<script>
function getAuthStore() {
  if (localStorage.getItem('token')) return localStorage;
  if (sessionStorage.getItem('token')) return sessionStorage;
  return null;
}
function getToken() {
  return getAuthStore()?.getItem('token') || '';
}

function redirectForRole(role) {
  if (role === 'super_admin') window.location.href = '/superadmin';
  else if (role === 'admin' || role === 'manager' || role === 'ip_updater') window.location.href = '/admin';
  else window.location.href = '/';
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('admin');
  sessionStorage.removeItem('token');
  sessionStorage.removeItem('admin');
  window.location.href = '/login';
}

function clientValidatePassword(p) {
  if (p.length < 8) return 'Password must be at least 8 characters';
  if (!/[a-z]/.test(p)) return 'Include a lowercase letter';
  if (!/[A-Z]/.test(p)) return 'Include an uppercase letter';
  if (!/[0-9]/.test(p)) return 'Include a number';
  if (!/[^A-Za-z0-9]/.test(p)) return 'Include a special character';
  return null;
}

async function handleSetPassword(e) {
  e.preventDefault();
  const errEl = document.getElementById('pwdError');
  const btn = document.getElementById('pwdBtn');
  errEl.classList.add('hidden');
  const new_password = document.getElementById('newPassword').value;
  const confirm_password = document.getElementById('confirmPassword').value;
  const localErr = clientValidatePassword(new_password);
  if (localErr) {
    errEl.textContent = localErr;
    errEl.classList.remove('hidden');
    return;
  }
  if (new_password !== confirm_password) {
    errEl.textContent = 'Passwords do not match';
    errEl.classList.remove('hidden');
    return;
  }
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/change-password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getToken(),
      },
      body: JSON.stringify({ new_password, confirm_password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      errEl.textContent = data.error || 'Could not update password';
      errEl.classList.remove('hidden');
      return;
    }
    const store = getAuthStore();
    if (store && data.admin) {
      store.setItem('admin', JSON.stringify(data.admin));
    }
    redirectForRole(data.admin?.role || 'admin');
  } catch {
    errEl.textContent = 'Network error. Try again.';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const token = getToken();
  if (!token) {
    window.location.href = '/login';
    return;
  }
  try {
    const res = await fetch('/api/verify', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) {
      logout();
      return;
    }
    const data = await res.json();
    if (!data.admin?.must_change_password) {
      redirectForRole(data.admin?.role || 'admin');
    }
  } catch {
    window.location.href = '/login';
  }
});
</script>
</body>
</html>
